name: Import Animal Photographs
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [final-two, missing, upgrade, expansion]
        default: final-two
      limit:
        type: choice
        options: ['2', '50', '100', '250']
        default: '2'
      offset:
        type: string
        default: '0'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: wd-clip-v32
      - uses: actions/cache@v4
        with:
          path: review
          key: wd-review-v32-${{ github.run_id }}
          restore-keys: wd-review-v32-
      - run: pip install requests pillow 'transformers>=4.48,<5' torch --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python tools/import_animals.py --mode "$MODE" --limit "$LIMIT" --offset "$OFFSET"
        env:
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit }}
          OFFSET: ${{ inputs.offset }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animal-photo-candidates
          path: review/
