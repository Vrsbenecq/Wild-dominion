name: Import Animal Photographs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow 'transformers>=4.48,<5' torch --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python tools/import_animals.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animal-photo-candidates
          path: review/
